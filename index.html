<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LUDO</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:radial-gradient(900px 600px at 50% -10%,#2A3560 0%,#141A38 55%,#0B1026 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#101736;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;align-items:center}
.hidden{display:none!important}
#menu{width:100%;max-width:420px;background:#FFFFFF;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.45);padding:30px 26px 28px;text-align:center;margin-top:6vh}
#menu h1{margin:0 0 4px;font-size:52px;font-weight:900;letter-spacing:16px;text-indent:16px;color:#101736;line-height:1}
#menu .rule{width:56px;height:4px;border-radius:2px;background:linear-gradient(90deg,#E53935,#FDD835,#43A047,#1E88E5);margin:14px auto 22px}
.lbl{font-size:11px;font-weight:800;letter-spacing:3px;color:#8A93A6;text-transform:uppercase;margin:18px 0 10px}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{min-width:52px;height:52px;padding:0 14px;border-radius:16px;border:2px solid #E3E6EE;background:#F7F8FA;font-size:19px;font-weight:800;color:#2A3350;cursor:pointer;font-family:inherit}
.pill.wide{font-size:15px}
.pill.sel{background:#101736;color:#fff;border-color:#101736;box-shadow:0 8px 18px rgba(16,23,54,.28)}
#startBtn{margin-top:26px;width:100%;padding:18px;border:0;border-radius:18px;background:#101736;color:#fff;font-size:20px;font-weight:900;letter-spacing:5px;cursor:pointer;font-family:inherit;box-shadow:0 12px 26px rgba(16,23,54,.35)}
#startBtn:disabled{opacity:.45;cursor:default;box-shadow:none;letter-spacing:2px;font-size:16px}
#onlineBox{margin-top:6px}
#onlineBox .row{display:flex;gap:10px;justify-content:center;margin-top:10px}
#roomInput{height:52px;width:130px;border-radius:16px;border:2px solid #E3E6EE;background:#F7F8FA;text-align:center;font-size:18px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:#101736;font-family:inherit;outline:none}
#roomInput:focus{border-color:#101736}
#roomCode{margin-top:14px;font-size:30px;font-weight:900;letter-spacing:8px;color:#101736;min-height:36px}
.mini{height:52px;padding:0 20px;border-radius:16px;border:2px solid #E3E6EE;background:#F7F8FA;font-size:15px;font-weight:800;color:#2A3350;cursor:pointer;font-family:inherit}
.mini.sel{background:#101736;color:#fff;border-color:#101736}
#game{width:100%}
#hud{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
#turnChip{display:flex;align-items:center;gap:9px;background:#fff;border-radius:999px;padding:10px 16px;font-weight:800;font-size:16px;color:#101736;box-shadow:0 8px 20px rgba(0,0,0,.28)}
#turnChip .dot{width:15px;height:15px;border-radius:50%;box-shadow:inset -2px -3px 4px rgba(0,0,0,.28),inset 2px 3px 4px rgba(255,255,255,.55)}
#seatDots{display:flex;gap:7px;align-items:center}
.seat{width:13px;height:13px;border-radius:50%;position:relative;box-shadow:inset -2px -2px 3px rgba(0,0,0,.25),0 2px 5px rgba(0,0,0,.3)}
.seat.left{opacity:.28}
.seat.left::after{content:"";position:absolute;left:-3px;top:5px;width:19px;height:2px;background:#fff;transform:rotate(-45deg);border-radius:1px}
#diceBtn{margin-left:auto;width:66px;height:66px;border-radius:18px;background:#fff;border:0;box-shadow:0 10px 22px rgba(0,0,0,.32);cursor:pointer;display:grid;place-items:center;padding:0}
#diceBtn:disabled{opacity:.45;cursor:default}
#diceBtn.tumble{animation:tumble .5s ease}
@keyframes tumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(100deg) scale(1.12)}55%{transform:rotate(220deg) scale(.94)}80%{transform:rotate(310deg) scale(1.06)}100%{transform:rotate(360deg) scale(1)}}
#muteBtn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
#boardWrap{width:100%;border-radius:22px;overflow:hidden;box-shadow:0 24px 55px rgba(0,0,0,.5);position:relative}
#boardWrap svg{display:block;width:100%;height:auto}
.token{cursor:pointer;transition:transform .12s ease-in-out}
.token.flying{transition:transform .45s ease-in,opacity .45s ease-in}
.movRing{display:none}
.token.movable .movRing{display:block;animation:pulseRing .8s ease-in-out infinite}
@keyframes pulseRing{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.turnRing{animation:pulseRing 1.1s ease-in-out infinite}
.shake{animation:shakeA .32s ease}
@keyframes shakeA{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#winOverlay{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(11,16,38,.55);z-index:5}
#winCard{background:#fff;border-radius:24px;padding:30px 40px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#winText{font-size:40px;font-weight:900;color:#101736;letter-spacing:2px}
#againBtn{margin-top:20px;padding:15px 30px;border:0;border-radius:16px;background:#101736;color:#fff;font-size:17px;font-weight:800;letter-spacing:2px;cursor:pointer;font-family:inherit}
#confetti{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:4}
.cf{position:absolute;width:9px;height:15px;top:-22px;border-radius:2px;animation:fallA 1.7s ease-in forwards}
@keyframes fallA{to{transform:translateY(105vh) rotate(720deg);opacity:.85}}
</style>
</head>
<body>
<div id="app">
  <div id="menu">
    <h1>LUDO</h1>
    <div class="rule"></div>
    <div class="lbl">Players</div>
    <div class="pills" id="countPills">
      <button class="pill" data-n="2">2</button>
      <button class="pill" data-n="3">3</button>
      <button class="pill sel" data-n="4">4</button>
      <button class="pill" data-n="5">5</button>
      <button class="pill" data-n="6">6</button>
    </div>
    <div class="lbl">Mode</div>
    <div class="pills" id="modePills">
      <button class="pill wide sel" data-m="together">Together</button>
      <button class="pill wide" data-m="online">Online</button>
    </div>
    <div id="onlineBox" class="hidden">
      <div class="row">
        <button class="mini" id="createBtn">Create</button>
        <input id="roomInput" maxlength="6" placeholder="CODE" autocomplete="off">
        <button class="mini" id="joinBtn">Join</button>
      </div>
      <div id="roomCode"></div>
    </div>
    <button id="startBtn">START</button>
  </div>

  <div id="game" class="hidden">
    <div id="hud">
      <div id="turnChip"><span class="dot" id="turnDot"></span><span id="turnText"></span></div>
      <div id="seatDots"></div>
      <button id="diceBtn" aria-label="Dice"></button>
      <button id="muteBtn" aria-label="Sound"></button>
    </div>
    <div id="boardWrap">
      <svg id="boardSvg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="confetti"></div>
      <div id="winOverlay" class="hidden">
        <div id="winCard">
          <div id="winText"></div>
          <button id="againBtn">Play Again</button>
        </div>
      </div>
    </div>
  </div>
</div>
<audio id="sndFirst6" src="hello-sulululu_0_7j54.mp3" preload="auto"></audio>
<audio id="sndKill" src="rag-korla_1_nz6g.mp3" preload="auto"></audio>
<script>
(function(){
"use strict";
var SVGNS="http://www.w3.org/2000/svg";
var COLORS=[
 {name:"Red",hex:"#E53935",dark:"#8E1616",light:"#FFCDD2"},
 {name:"Green",hex:"#43A047",dark:"#1B5E20",light:"#C8E6C9"},
 {name:"Yellow",hex:"#FDD835",dark:"#9E7D00",light:"#FFF9C4"},
 {name:"Blue",hex:"#1E88E5",dark:"#0D47A1",light:"#BBDEFB"},
 {name:"Purple",hex:"#8E24AA",dark:"#4A148C",light:"#E1BEE7"},
 {name:"Orange",hex:"#FB8C00",dark:"#8A4B00",light:"#FFE0B2"}
];
var TRACK_LEN=60, HOME_LEN=5, FINISH=57, CENTER={x:400,y:400}, RING_LO=140, RING_HI=660;
var $=function(id){return document.getElementById(id);};
var svg=$("boardSvg");
var state=null, mySeat=-1, isHost=false, peer=null, conns=[], roomCode="", muted=false, audioCtx=null;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function el(name,attrs,parent){var e=document.createElementNS(SVGNS,name);for(var k in attrs){e.setAttribute(k,attrs[k]);}if(parent){parent.appendChild(e);}return e;}
function trackPos(i){
 var s=(RING_HI-RING_LO)/15;
 if(i<15){return {x:RING_LO+i*s,y:RING_LO};}
 if(i<30){return {x:RING_HI,y:RING_LO+(i-15)*s};}
 if(i<45){return {x:RING_HI-(i-30)*s,y:RING_HI};}
 return {x:RING_LO,y:RING_HI-(i-45)*s};
}
function startIdx(p){return p*10;}
function isSafe(idx){for(var i=0;i<6;i++){if(idx===startIdx(i)){return true;}}return false;}
function basePos(p){
 var s=trackPos(startIdx(p));
 var dx=s.x-CENTER.x, dy=s.y-CENTER.y, d=Math.sqrt(dx*dx+dy*dy);
 var f=(d+78)/d;
 return {x:CENTER.x+dx*f, y:CENTER.y+dy*f};
}
function homePos(p,k){
 var s=trackPos(startIdx(p));
 var dx=CENTER.x-s.x, dy=CENTER.y-s.y, d=Math.sqrt(dx*dx+dy*dy);
 var step=(d-84)/HOME_LEN;
 return {x:s.x+dx/d*step*(k+1), y:s.y+dy/d*step*(k+1)};
}
function baseSlot(p,t){
 var b=basePos(p);
 var ox=(t%2===0?-19:19), oy=(t<2?-19:19);
 return {x:b.x+ox,y:b.y+oy};
}
function centreSlot(t){
 var ox=(t%2===0?-20:20), oy=(t<2?-20:20);
 return {x:CENTER.x+ox,y:CENTER.y+oy};
}
function tokenPos(p,t){
 var st=state.players[p].steps[t];
 if(st===-1){return baseSlot(p,t);}
 if(st===-2){return null;}
 if(st>=0&&st<=51){return trackPos((startIdx(p)+st)%TRACK_LEN);}
 if(st>=52&&st<=56){return homePos(p,st-52);}
 return centreSlot(t);
}
function buildDefs(){
 var defs=el("defs",{},svg);
 COLORS.forEach(function(c){
  var g=el("radialGradient",{id:"grad-"+c.name,cx:"35%",cy:"30%",r:"75%"},defs);
  el("stop",{offset:"0%","stop-color":"#FFFFFF","stop-opacity":"0.95"},g);
  el("stop",{offset:"28%","stop-color":c.hex,"stop-opacity":"1"},g);
  el("stop",{offset:"100%","stop-color":c.dark,"stop-opacity":"1"},g);
 });
}
function buildBoard(){
 svg.innerHTML="";
 buildDefs();
 el("rect",{x:0,y:0,width:800,height:800,rx:22,fill:"#FDFBF3"},svg);
 var ring=el("rect",{x:112,y:112,width:576,height:576,rx:48,fill:"#F1EAD8",stroke:"#E2D9BE","stroke-width":2},svg);
 var i,k;
 for(i=0;i<TRACK_LEN;i++){
  var p=trackPos(i);
  var safe=isSafe(i);
  var owner=-1;
  for(var q=0;q<6;q++){if(i===startIdx(q)){owner=q;}}
  var fill=safe?COLORS[owner].light:"#FFFFFF";
  var stroke=safe?COLORS[owner].hex:"#D8D2C0";
  el("rect",{x:p.x-16,y:p.y-16,width:32,height:32,rx:8,fill:fill,stroke:stroke,"stroke-width":safe?2.5:1.5},svg);
  if(safe){
   var st=el("text",{x:p.x,y:p.y+6,"text-anchor":"middle","font-size":17,fill:COLORS[owner].hex,"font-weight":"bold"},svg);
   st.textContent="\u2605";
  }
 }
 for(i=0;i<6;i++){
  for(k=0;k<HOME_LEN;k++){
   var hp=homePos(i,k);
   el("circle",{cx:hp.x,cy:hp.y,r:15,fill:COLORS[i].light,stroke:COLORS[i].hex,"stroke-width":2},svg);
  }
 }
 var angles=[];
 for(i=0;i<6;i++){
  var sp=trackPos(startIdx(i));
  angles.push(Math.atan2(sp.y-CENTER.y,sp.x-CENTER.x));
 }
 for(i=0;i<6;i++){
  var prev=angles[(i+5)%6], next=angles[(i+1)%6];
  var a1=midAngle(prev,angles[i]), a2=midAngle(angles[i],next);
  var x1=CENTER.x+72*Math.cos(a1), y1=CENTER.y+72*Math.sin(a1);
  var x2=CENTER.x+72*Math.cos(a2), y2=CENTER.y+72*Math.sin(a2);
  var large=((a2-a1+Math.PI*2)%(Math.PI*2))>Math.PI?1:0;
  el("path",{d:"M 400 400 L "+x1.toFixed(1)+" "+y1.toFixed(1)+" A 72 72 0 "+large+" 1 "+x2.toFixed(1)+" "+y2.toFixed(1)+" Z",fill:COLORS[i].hex,stroke:"#FFFFFF","stroke-width":2},svg);
 }
 el("circle",{cx:400,cy:400,r:72,fill:"none",stroke:"#FFFFFF","stroke-width":3},svg);
 var star=el("text",{x:400,y:409,"text-anchor":"middle","font-size":26,fill:"#FFFFFF","font-weight":"bold"},svg);
 star.textContent="\u2605";
 var bases=el("g",{id:"bases"},svg);
 for(i=0;i<6;i++){
  var b=basePos(i), c=COLORS[i];
  var g=el("g",{id:"base-"+i},bases);
  el("circle",{class:"turnRing",id:"turnRing-"+i,cx:b.x,cy:b.y,r:58,fill:"none",stroke:c.hex,"stroke-width":4,opacity:0},g);
  el("circle",{cx:b.x,cy:b.y,r:48,fill:c.hex},g);
  el("circle",{cx:b.x,cy:b.y,r:48,fill:"none",stroke:"rgba(0,0,0,.18)","stroke-width":2},g);
  el("circle",{cx:b.x,cy:b.y,r:37,fill:"#FFFFFF"},g);
  for(var t=0;t<4;t++){
   var sl=baseSlot(i,t);
   el("circle",{cx:sl.x,cy:sl.y,r:12.5,fill:"#FFFFFF",stroke:c.hex,"stroke-width":2},g);
  }
 }
 el("g",{id:"tokens"},svg);
}
function midAngle(a,b){
 var d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;
 return a+d/2;
}
function buildTokens(){
 var layer=$("tokens");
 while(layer.firstChild){layer.removeChild(layer.firstChild);}
 for(var p=0;p<state.n;p++){
  for(var t=0;t<4;t++){
   var g=el("g",{"class":"token",id:"tok-"+p+"-"+t,"data-p":p,"data-t":t},layer);
   el("ellipse",{cx:0,cy:12,rx:12,ry:5,fill:"rgba(0,0,0,.28)"},g);
   el("circle",{class:"movRing",cx:0,cy:0,r:19,fill:"none",stroke:"#101736","stroke-width":3},g);
   el("circle",{cx:0,cy:0,r:13.5,fill:"url(#grad-"+COLORS[p].name+")",stroke:COLORS[p].dark,"stroke-width":2},g);
   el("ellipse",{cx:-4.5,cy:-5.5,rx:4.5,ry:3,fill:"rgba(255,255,255,.9)",transform:"rotate(-30 -4.5 -5.5)"},g);
   g.addEventListener("click",function(){
    var pp=parseInt(this.getAttribute("data-p"),10);
    var tt=parseInt(this.getAttribute("data-t"),10);
    onTokenTap(pp,tt);
   });
  }
 }
 renderTokens();
}
function renderTokens(){
 for(var p=0;p<state.n;p++){
  for(var t=0;t<4;t++){
   var g=$("tok-"+p+"-"+t);
   if(!g){continue;}
   var pos=tokenPos(p,t);
   if(!pos){g.setAttribute("visibility","hidden");continue;}
   g.setAttribute("visibility","visible");
   g.setAttribute("transform","translate("+pos.x.toFixed(1)+" "+pos.y.toFixed(1)+")");
   var mov=state.phase==="move"&&state.turn===p&&state.movable.some(function(m){return m.p===p&&m.t===t;});
   if(mov){g.setAttribute("class","token movable");}else{g.setAttribute("class","token");}
  }
 }
}
function renderHud(){
 var c=COLORS[state.turn];
 $("turnDot").style.background=c.hex;
 $("turnText").textContent=c.name+"'s turn";
 var dots=$("seatDots");
 dots.innerHTML="";
 for(var p=0;p<state.n;p++){
  var s=document.createElement("span");
  s.className="seat"+(state.left[p]?" left":"");
  s.style.background=COLORS[p].hex;
  dots.appendChild(s);
 }
 for(var q=0;q<6;q++){
  var ring=$("turnRing-"+q);
  if(ring){ring.setAttribute("opacity",(q===state.turn&&state.phase!=="over")?1:0);}
 }
 var mine=(state.mode==="together")||(mySeat===state.turn);
 $("diceBtn").disabled=!(state.phase==="roll"&&mine);
}
function diceFace(v){
 var map={1:[[50,50]],2:[[32,32],[68,68]],3:[[30,30],[50,50],[70,70]],4:[[32,32],[68,32],[32,68],[68,68]],5:[[30,30],[70,30],[50,50],[30,70],[70,70]],6:[[32,28],[68,28],[32,50],[68,50],[32,72],[68,72]]};
 var s='<svg width="46" height="46" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="18" fill="#101736"/>';
 map[v].forEach(function(pt){s+='<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="9" fill="#fff"/>';});
 return s+"</svg>";
}
function beep(freq,dur){
 if(muted){return;}
 try{
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.12,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}
function playSound(id){
 if(muted){return;}
 var a=$(id);
 if(a){try{var pr=a.play(); if(pr&&pr.catch){pr.catch(function(){});}}catch(e){}}
}
function newGame(n,mode){
 state={n:n,mode:mode,turn:0,dice:0,phase:"roll",movable:[],firstSixPlayed:false,left:[],players:[]};
 for(var p=0;p<n;p++){state.players.push({steps:[-1,-1,-1,-1]});state.left.push(false);}
 buildTokens();
 renderHud();
 $("diceBtn").innerHTML=diceFace(6);
 $("winOverlay").classList.add("hidden");
}
function startGame(){
 newGame(menuN,menuMode);
 $("menu").classList.add("hidden");
 $("game").classList.remove("hidden");
 if(audioCtx&&audioCtx.resume){audioCtx.resume();}
 broadcast();
}
function computeMovable(){
 var mov=[];
 var p=state.turn;
 for(var t=0;t<4;t++){
  var st=state.players[p].steps[t];
  if(st===-1){if(state.dice===6){mov.push({p:p,t:t});}}
  else if(st>=0&&st<57){if(st+state.dice<=FINISH){mov.push({p:p,t:t});}}
 }
 return mov;
}
function nextTurn(){
 do{state.turn=(state.turn+1)%state.n;}while(state.left[state.turn]);
 state.phase="roll";
 state.dice=0;
 state.movable=[];
 renderTokens();
 renderHud();
 broadcast();
}
async function rollDice(){
 if(!state||state.phase!=="roll"){return;}
 if(state.mode==="online"&&!isHost&&!netAct){sendToHost({type:"roll"});return;}
 if(state.mode==="online"&&mySeat!==state.turn&&!netAct){return;}
 var btn=$("diceBtn");
 btn.disabled=true;
 btn.classList.add("tumble");
 var faces=[1,2,3,4,5,6];
 for(var i=0;i<5;i++){btn.innerHTML=diceFace(faces[Math.floor(Math.random()*6)]);await sleep(90);}
 btn.classList.remove("tumble");
 state.dice=1+Math.floor(Math.random()*6);
 btn.innerHTML=diceFace(state.dice);
 beep(520,0.08);
 if(state.dice===6&&!state.firstSixPlayed){
  state.firstSixPlayed=true;
  playSound("sndFirst6");
 }
 state.movable=computeMovable();
 if(state.movable.length===0){
  renderTokens();renderHud();
  await sleep(750);
  nextTurn();
  return;
 }
 state.phase="move";
 renderTokens();
 renderHud();
 broadcast();
}
function canEatAt(absIdx,owner){
 if(isSafe(absIdx)){return null;}
 for(var p=0;p<state.n;p++){
  if(p===owner||state.left[p]){continue;}
  for(var t=0;t<4;t++){
   var st=state.players[p].steps[t];
   if(st>=0&&st<=51&&(startIdx(p)+st)%TRACK_LEN===absIdx){return {p:p,t:t};}
  }
 }
 return null;
}
async function onTokenTap(p,t){
 if(!state||state.phase!=="move"){return;}
 if(p!==state.turn){return;}
 if(state.mode==="online"&&mySeat!==p){return;}
 var ok=state.movable.some(function(m){return m.p===p&&m.t===t;});
 if(!ok){return;}
 if(state.mode==="online"&&!isHost){sendToHost({type:"move",p:p,t:t});return;}
 await applyMove(p,t);
}
async function applyMove(p,t){
 state.phase="anim";
 renderTokens();renderHud();
 var dice=state.dice;
 var g=$("tok-"+p+"-"+t);
 if(state.players[p].steps[t]===-1){
  state.players[p].steps[t]=0;
  var pos0=tokenPos(p,t);
  if(pos0&&g){g.setAttribute("transform","translate("+pos0.x.toFixed(1)+" "+pos0.y.toFixed(1)+")");}
  beep(660,0.05);
  await sleep(120);
 }else{
  for(var s=0;s<dice;s++){
   state.players[p].steps[t]++;
   var pos=tokenPos(p,t);
   if(pos&&g){g.setAttribute("transform","translate("+pos.x.toFixed(1)+" "+pos.y.toFixed(1)+")");}
   beep(660,0.05);
   await sleep(120);
  }
 }
 var st=state.players[p].steps[t];
 var extra=false;
 if(dice===6){extra=true;}
 if(st>=0&&st<=51){
  var abs=(startIdx(p)+st)%TRACK_LEN;
  var victim=canEatAt(abs,p);
  if(victim){
   extra=true;
   playSound("sndKill");
   var vg=$("tok-"+victim.p+"-"+victim.t);
   if(vg){vg.setAttribute("class","token shake");}
   await sleep(340);
   if(vg){vg.setAttribute("class","token flying");vg.style.opacity="0.25";}
   state.players[victim.p].steps[victim.t]=-1;
   var bp=baseSlot(victim.p,victim.t);
   if(vg){vg.setAttribute("transform","translate("+bp.x.toFixed(1)+" "+bp.y.toFixed(1)+") scale(0.3)");}
   await sleep(460);
   if(vg){vg.style.opacity="";vg.setAttribute("class","token");}
  }
 }
 renderTokens();
 var won=state.players[p].steps.every(function(x){return x===FINISH;});
 if(won){
  state.phase="over";
  renderHud();
  $("winText").textContent=COLORS[p].name+" Wins";
  $("winOverlay").classList.remove("hidden");
  confetti();
  beep(880,0.25);
  broadcast();
  return;
 }
 if(extra){state.phase="roll";state.movable=[];renderTokens();renderHud();broadcast();return;}
 nextTurn();
}
function confetti(){
 var box=$("confetti");
 box.innerHTML="";
 var cols=COLORS.map(function(c){return c.hex;});
 for(var i=0;i<70;i++){
  var d=document.createElement("div");
  d.className="cf";
  d.style.left=(Math.random()*100)+"%";
  d.style.background=cols[i%cols.length];
  d.style.animationDelay=(Math.random()*0.5)+"s";
  d.style.transform="rotate("+Math.floor(Math.random()*360)+"deg)";
  box.appendChild(d);
 }
 setTimeout(function(){box.innerHTML="";},2400);
}
function resetGame(){
 var n=state?state.n:4, mode=state?state.mode:"together";
 state=null;
 newGame(n,mode);
 $("winOverlay").classList.add("hidden");
 if(mode==="online"&&isHost){broadcast();}
}
var menuN=4, menuMode="together", hostConn=null, netAct=false;
function joinedCount(){return isHost?(conns.length+1):(mySeat>=0?1:0);}
function updateStart(){
 var btn=$("startBtn");
 if(menuMode==="online"){
  if(isHost&&joinedCount()>=menuN){btn.disabled=false;btn.textContent="START";}
  else{btn.disabled=true;btn.textContent="Waiting for players";}
 }else{
  btn.disabled=false;
  btn.textContent="START";
 }
}
function serialState(){
 return {n:state.n,mode:state.mode,turn:state.turn,dice:state.dice,phase:state.phase,movable:state.movable,firstSixPlayed:state.firstSixPlayed,left:state.left.slice(),players:state.players.map(function(p){return {steps:p.steps.slice()};})};
}
function broadcast(){
 if(!state||state.mode!=="online"||!isHost){return;}
 var msg={type:"state",state:serialState()};
 conns.forEach(function(c){try{c.conn.send(msg);}catch(e){}});
}
function applyNetState(s){
 var had=!!state;
 state={n:s.n,mode:s.mode,turn:s.turn,dice:s.dice,phase:s.phase,movable:s.movable,firstSixPlayed:s.firstSixPlayed,left:s.left.slice(),players:s.players.map(function(p){return {steps:p.steps.slice()};})};
 if(!had){
  $("menu").classList.add("hidden");
  $("game").classList.remove("hidden");
  buildTokens();
 }
 $("diceBtn").innerHTML=diceFace(state.dice||6);
 renderTokens();
 renderHud();
}
function sendToHost(msg){if(hostConn){try{hostConn.send(msg);}catch(e){}}}
function makeCode(){
 var chars="ABCDEFGHJKMNPQRSTVWXYZ23456789", out="";
 for(var i=0;i<6;i++){out+=chars[Math.floor(Math.random()*chars.length)];}
 return out;
}
function createRoom(){
 if(typeof Peer==="undefined"){return;}
 roomCode=makeCode();
 peer=new Peer("ludo-"+roomCode);
 peer.on("open",function(){
  isHost=true;mySeat=0;
  $("roomCode").textContent=roomCode;
  $("createBtn").classList.add("sel");
  updateStart();
 });
 peer.on("connection",function(conn){
  conn.on("open",function(){
   if(conns.length+1>=menuN){return;}
   var seat=conns.length+1;
   conns.push({conn:conn,seat:seat});
   conn.send({type:"welcome",seat:seat,n:menuN});
   conn.on("data",function(msg){onGuestMsg(msg,seat);});
   conn.on("close",function(){onGuestLeft(seat);});
   updateStart();
  });
 });
}
function onGuestMsg(msg,seat){
 if(!state||state.mode!=="online"||!isHost){return;}
 if(msg.type==="roll"&&seat===state.turn){netAct=true;rollDice();netAct=false;}
 if(msg.type==="move"&&seat===state.turn&&state.phase==="move"){
  var ok=state.movable.some(function(m){return m.p===msg.p&&m.t===msg.t;});
  if(ok){netAct=true;applyMove(msg.p,msg.t);netAct=false;}
 }
}
function onGuestLeft(seat){
 var idx=-1;
 for(var i=0;i<conns.length;i++){if(conns[i].seat===seat){idx=i;}}
 if(idx>=0){conns.splice(idx,1);}
 if(!state){updateStart();return;}
 state.left[seat]=true;
 state.players[seat].steps=[-2,-2,-2,-2];
 if(state.turn===seat){nextTurn();return;}
 renderTokens();renderHud();broadcast();
 updateStart();
}
function joinRoom(){
 if(typeof Peer==="undefined"){return;}
 var code=($("roomInput").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 if(code.length!==6){return;}
 roomCode=code;
 peer=new Peer();
 peer.on("open",function(){
  hostConn=peer.connect("ludo-"+code);
  hostConn.on("data",function(msg){
   if(msg.type==="welcome"){mySeat=msg.seat;menuN=msg.n;updateStart();}
   if(msg.type==="state"){applyNetState(msg.state);}
  });
  hostConn.on("open",function(){$("joinBtn").classList.add("sel");});
 });
}
document.querySelectorAll("#countPills .pill").forEach(function(b){
 b.addEventListener("click",function(){
  document.querySelectorAll("#countPills .pill").forEach(function(x){x.classList.remove("sel");});
  b.classList.add("sel");
  menuN=parseInt(b.getAttribute("data-n"),10);
  updateStart();
 });
});
document.querySelectorAll("#modePills .pill").forEach(function(b){
 b.addEventListener("click",function(){
  document.querySelectorAll("#modePills .pill").forEach(function(x){x.classList.remove("sel");});
  b.classList.add("sel");
  menuMode=b.getAttribute("data-m");
  $("onlineBox").classList.toggle("hidden",menuMode!=="online");
  updateStart();
 });
});
$("createBtn").addEventListener("click",createRoom);
$("joinBtn").addEventListener("click",joinRoom);
$("startBtn").addEventListener("click",function(){
 if(menuMode==="online"&&!isHost){return;}
 startGame();
});
$("diceBtn").addEventListener("click",function(){rollDice();});
$("againBtn").addEventListener("click",resetGame);
var SPK_ON='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="#fff" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
var SPK_OFF='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="#fff" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
$("muteBtn").innerHTML=SPK_ON;
$("muteBtn").addEventListener("click",function(){
 muted=!muted;
 $("muteBtn").innerHTML=muted?SPK_OFF:SPK_ON;
 if(!muted){beep(700,0.06);}
});
function startWith(n){
 menuN=n;menuMode="together";isHost=false;mySeat=-1;
 startGame();
}
buildBoard();
$("diceBtn").innerHTML=diceFace(6);
(function(){
 var m=(window.location.search||"").match(/room=([A-Za-z0-9]{6})/);
 if(m){
  menuMode="online";
  document.querySelectorAll("#modePills .pill").forEach(function(x){x.classList.toggle("sel",x.getAttribute("data-m")==="online");});
  $("onlineBox").classList.remove("hidden");
  $("roomInput").value=m[1].toUpperCase();
  updateStart();
 }
})();
window.__ludo={get state(){return state;},set state(v){state=v;},COLORS:COLORS,startGame:startGame,startWith:startWith,newGame:newGame,rollDice:rollDice,applyMove:applyMove,onTokenTap:onTokenTap,computeMovable:computeMovable,trackPos:trackPos,homePos:homePos,basePos:basePos,tokenPos:tokenPos,renderTokens:renderTokens,renderHud:renderHud,nextTurn:nextTurn,TRACK_LEN:TRACK_LEN,FINISH:FINISH};
})();
</script>
</body>
